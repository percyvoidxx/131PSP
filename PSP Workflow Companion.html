<title>PSP Workflow Companion</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky navy header, amber disclaimer strip, one centered column of cards (max 1040px), footer. Healthcare-adjacent SaaS look from the brief. */
:root {
  --navy: #153B50;
  --teal: #0D9488;
  --teal-soft: #DDF3EF;
  --amber: #E9A23B;
  --amber-soft: #FDF3E1;
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #1F2937;
  --muted: #64748B;
  --line: #DDE3EA;
  --heading: #153B50;
  --btn: #0B766C;
  --btn-hover: #095F57;
  --link: #0B766C;
  --head-bg: #153B50;
  --head-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(21,59,80,.06), 0 6px 18px rgba(21,59,80,.06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --teal-soft: #14403F;
    --amber-soft: #3A2E14;
    --bg: #0E1A23;
    --surface: #152632;
    --surface-2: #1B2E3B;
    --ink: #E6EDF3;
    --muted: #9AABBA;
    --line: #2A3F4E;
    --heading: #E6EDF3;
    --link: #5EDAC9;
    --head-bg: #0B2230;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --teal-soft: #14403F;
  --amber-soft: #3A2E14;
  --bg: #0E1A23;
  --surface: #152632;
  --surface-2: #1B2E3B;
  --ink: #E6EDF3;
  --muted: #9AABBA;
  --line: #2A3F4E;
  --heading: #E6EDF3;
  --link: #5EDAC9;
  --head-bg: #0B2230;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 96px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
.page { display: flex; flex-direction: column; min-height: 100vh; }
.wrap {
  width: 100%;
  max-width: 1104px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { color: var(--heading); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: clamp(1.3rem, 1.1rem + 1vw, 1.7rem); font-weight: 650; letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
h1:focus, h2:focus { outline: none; }

/* header */
.site-head { background: var(--head-bg); color: var(--head-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head-bg); }
.head-row { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: inherit; cursor: pointer; padding: 4px; font-weight: 650; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--teal); display: grid; place-items: center; }
.nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; max-width: 100%; scrollbar-width: thin; }
.nav button { background: none; border: 0; color: rgba(255,255,255,.82); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: .92rem; font-weight: 500; white-space: nowrap; }
.nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav button[aria-current="page"] { background: rgba(255,255,255,.16); color: #fff; }
.site-head :focus-visible { outline-color: #fff; }
.disclaimer { background: var(--amber-soft); color: var(--ink); border-bottom: 1px solid var(--amber); font-size: .85rem; font-weight: 500; text-align: center; padding-block: 8px; }

/* main */
main { flex: 1; padding-block: 36px 56px; }
.stack { display: flex; flex-direction: column; gap: 24px; }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px; }
.card.flat { box-shadow: none; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pcard { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.pcard p { color: var(--muted); max-width: 46ch; }
.pcard .btn { margin-top: auto; }
.ico { width: 48px; height: 48px; border-radius: 12px; background: var(--teal-soft); color: var(--link); display: grid; place-items: center; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico svg.i { width: 24px; height: 24px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .78rem; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.chip.teal { background: var(--teal-soft); border-color: transparent; color: var(--link); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: .95rem; cursor: pointer; border: 1px solid transparent; background: var(--btn); color: #fff; text-decoration: none; }
.btn:hover { background: var(--btn-hover); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn-row .spacer { flex: 1; }
.linkbtn { background: none; border: 0; color: var(--link); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* progress */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-top { display: flex; justify-content: space-between; gap: 12px; font-size: .85rem; color: var(--muted); font-weight: 500; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg { height: 6px; border-radius: 999px; background: var(--line); }
.seg.done { background: var(--teal); }
.seg.now { background: var(--navy); }
:root[data-theme="dark"] .seg.now { background: #8FD3E8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg.now { background: #8FD3E8; } }

/* workflow layout */
.two-col { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.case-card { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px; font-size: .95rem; }
.case-card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.case-card dt { color: var(--muted); font-size: .85rem; }
.case-card dd { margin: 0; font-weight: 500; }
.prompt { border-left: 4px solid var(--teal); padding: 4px 0 4px 16px; font-size: 1.1rem; font-weight: 500; color: var(--heading); }
.ask { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; }
.support { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.support h3 { display: flex; gap: 8px; align-items: center; }
.support p { font-size: .94rem; }
.support.active { box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 45%, transparent); }
.support .tag { font-size: .8rem; font-weight: 600; }
.stepper { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.stepper li { display: flex; gap: 10px; align-items: center; font-size: .9rem; color: var(--muted); padding: 6px 8px; border-radius: 8px; }
.stepper li .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-weight: 600; flex: none; }
.stepper li.now { color: var(--heading); font-weight: 600; background: var(--surface-2); }
.stepper li.now .n { border-color: var(--navy); background: var(--navy); color: #fff; }
.stepper li.done .n { background: var(--teal); border-color: var(--teal); color: #fff; }

/* choices */
.choices { display: grid; gap: 12px; }
.choice { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.choice:hover { border-color: var(--teal); }
.choice .letter { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 650; font-size: .85rem; flex: none; color: var(--heading); }
.choice[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-soft); }
.choice[aria-pressed="true"] .letter { background: var(--teal); border-color: var(--teal); color: #fff; }
.choice span.t { padding-top: 3px; }
.feedback { border-radius: 14px; padding: 18px 20px; border: 1px solid var(--line); display: grid; gap: 6px; }
.feedback.good { background: var(--teal-soft); border-color: transparent; }
.feedback.think { background: var(--amber-soft); border-color: var(--amber); }
.feedback .fh { font-weight: 650; color: var(--heading); display: flex; gap: 8px; align-items: center; }
.sceneblock { background: var(--surface-2); border-radius: 12px; padding: 16px 18px; border: 1px solid var(--line); }

/* forms */
.form { display: grid; gap: 22px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-weight: 600; color: var(--heading); padding: 0; margin-bottom: 8px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt label { display: inline-block; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: .92rem; font-weight: 500; cursor: pointer; }
.opt input:checked + label { background: var(--teal-soft); border-color: var(--teal); color: var(--heading); font-weight: 600; }
.opt input:focus-visible + label { outline: 3px solid var(--teal); outline-offset: 2px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; color: var(--heading); }
textarea { width: 100%; min-height: 88px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; line-height: 1.5; }
textarea:focus { outline: 3px solid color-mix(in srgb, var(--teal) 50%, transparent); border-color: var(--teal); }
.hint { font-size: .85rem; color: var(--muted); }
.divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
.notice { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: .9rem; color: var(--muted); }
.confirm { text-align: left; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.tick { width: 52px; height: 52px; border-radius: 50%; background: var(--teal-soft); color: var(--link); display: grid; place-items: center; }
.tick svg.i { width: 28px; height: 28px; }

/* data */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
td { font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.export { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; min-height: 150px; white-space: pre; overflow: auto; }
.toast { color: var(--link); font-weight: 600; font-size: .9rem; }

footer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 22px; font-size: .85rem; color: var(--muted); }
.foot-row { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

@media (max-width: 820px) {
  .grid-2, .grid-3, .two-col { grid-template-columns: minmax(0, 1fr); }
  .stepper-wrap { display: none; }
  .card { padding: 20px; }
  main { padding-block: 24px 40px; }
  .nav { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: .6; } to { opacity: 1; } }
}
</style>

<script>
(function () {
  "use strict";

  /* ---------- storage helpers (all wrapped; page works without storage) ---------- */
  var mem = {};
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return mem[k] !== undefined ? mem[k] : d; } }
  function save(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var feedbackList = load("psp_feedback", []);
  var reflections = load("psp_reflections", []);
  var eventLog = load("psp_events", []);

  function logEvent(type, detail) {

  /* ---------- content ---------- */
  var AID_STEPS = [
    {

    {

    {

      prompt: "Which actions does the guidance require, and in what order?",
      ask: ["Is a verification step required first?", "Are there follow-up attempts to schedule?", "Does anything need to be handed to another team?"]
    },
    {
      title: "Confirm documentation",
      explain: "Before closing the case, check that the required notes and follow-up details are recorded.",
      prompt: "Is every completed action documented, and is the next follow-up recorded?",
      ask: ["Are your notes readable by a teammate who picks this up?", "Did you check the previous notes on this case?", "Is the next follow-up date recorded?"]
    }
  ];

  var D1 = {
    scene: null,
    q: "What should you do next?",
    choices: [
      { l: "A", t: "Proceed using your memory of a similar case.", tone: "think", h: "Consider verifying first", f: "Relying on memory may result in applying an incorrect requirement. Consider verifying the relevant information before proceeding." },
      { l: "B", t: "Consult the current approved guidance for the applicable case context.", tone: "good", h: "An appropriate next step", f: "Consulting current approved guidance is an appropriate information-retrieval step. Continue by reviewing the relevant requirements." },
      { l: "C", t: "Ask a teammate to perform the entire workflow.", tone: "think", h: "Support can help, with a caveat", f: "Seeking support can be appropriate, but a complete handoff may be unnecessary if clarification is sufficient." }
    ]

  var D2 = {

    choices: [
      { l: "A", t: "Guess based on a similar case.", tone: "think", h: "Consider another approach", f: "An unverified assumption may result in an incorrect action." },
      { l: "B", t: "Seek clarification through the designated support channel.", tone: "good", h: "An appropriate next step", f: "Resolving uncertainty through an appropriate support channel helps avoid proceeding with an unclear requirement." },
      { l: "C", t: "Proceed without resolving the uncertainty.", tone: "think", h: "Consider another approach", f: "Proceeding without clarification may leave a relevant requirement unresolved." }
    ]
  };
  var REFLECT_Q = [
    "What information was most important in making your decision?",
    "At what point did you need additional support?",
    "What would you verify before completing a similar workflow?"
  ];

  /* ---------- icons ---------- */
  var IC = {
    compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
    branch: '<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/>',
    right: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    left: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    help: '<circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/>',

  function icon(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>'; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- state ---------- */
  var S = {
    view: "home",
    aidStep: 0, aidClear: null, aidDone: false,
    scen: "intro", d1: null, d2: null, fbSeen: {}, refl: ["", "", ""], reflSaved: false,

  function vHome() {
    return '<div class="view stack">' +
      '<div class="stack" style="gap:10px"><span class="eyebrow">Academic prototype for usability review</span>' +
      '<h1 id="h" tabindex="-1">PSP Workflow Companion</h1>' +

  function vScenario() {

  function toCSV() {
    var rows = [FB_COLS.join(",")];
    feedbackList.forEach(function (r) { rows.push(FB_COLS.map(function (c) { return csvCell(r[c]); }).join(",")); });
    return rows.join("\n");

  /* ---------- render ---------- */

  function go(view) {

    if (view === "scenario") { resetScenario(); }

  function resetScenario() { S.scen = "intro"; S.d1 = null; S.d2 = null; S.refl = ["", "", ""]; S.reflSaved = false; S.fbSeen = {}; }

  /* ---------- actions ---------- */
  function onAction(a, el) {
    var p = a.split(":");
    switch (p[0]) {
      case "go": go(p[1]); break;
      case "aid-pick":
        S.aidClear = p[1] === "yes";
        logEvent("choice_selected", "aid decision: requirements clear = " + (S.aidClear ? "yes" : "no"));
        render(false); break;
      case "aid-next":
        if (S.aidStep < 4) aidOpen(S.aidStep + 1); else { S.aidDone = true; render(true); }
        break;
      case "aid-back":
        if (S.aidStep === 0) go("home"); else aidOpen(S.aidStep - 1);
        break;
      case "aid-restart": S.aidStep = 0; S.aidClear = null; S.aidDone = false; aidOpen(0); break;
      case "sc-begin": S.scen = "d1"; logEvent("step_opened", "scenario decision 1"); render(true); break;
      case "sc-pick":
        var key = p[1], idx = parseInt(p[2], 10), D = key === "d1" ? D1 : D2;
        S[key] = idx;
        logEvent("choice_selected", "scenario " + key + " = " + D.choices[idx].l);
        logEvent("feedback_viewed", "scenario " + key + " feedback " + D.choices[idx].l);
        render(false); break;
      case "sc-next":
        if (S.scen === "d1") { S.scen = "d2"; logEvent("step_opened", "scenario decision 2"); }
        else if (S.scen === "d2") { S.scen = "reflect"; logEvent("step_opened", "scenario reflection"); }
        render(true); break;
      case "reflect-submit":
        reflections.push({ submitted_at: new Date().toISOString(), d1: D1.choices[S.d1] ? D1.choices[S.d1].l : "", d2: D2.choices[S.d2] ? D2.choices[S.d2].l : "", answers: REFLECT_Q.map(function (q, i) { return { prompt: q, response: S.refl[i] }; }) });
        save("psp_reflections", reflections);
        S.reflSaved = true; logEvent("scenario_completed", "reflection submitted");
        render(false); break;
      case "sc-restart": resetScenario(); S.scen = "d1"; logEvent("step_opened", "scenario restarted, decision 1"); render(true); break;
      case "fb-again": S.fbSaved = false; render(true); break;
      case "fmt": S.exportFmt = p[1]; S.toast = ""; render(false); break;
      case "copy": copyExport(); break;
      case "clear-fb": S.confirmClear = "fb"; render(false); break;
      case "clear-log": S.confirmClear = "log"; render(false); break;
      case "clear-no": S.confirmClear = ""; render(false); break;
      case "clear-fb-yes": feedbackList = []; reflections = []; save("psp_feedback", feedbackList); save("psp_reflections", reflections); S.confirmClear = ""; S.toast = "Cleared."; render(false); break;
      case "clear-log-yes": eventLog = []; save("psp_events", eventLog); S.confirmClear = ""; S.toast = "Log cleared."; render(false); break;

    }
    var txt = function (n) { return form.querySelector("#" + n).value.trim(); };
    feedbackList.push({
      participant_id: get("pid"), prototype_reviewed: get("proto"), q1_understand: get("q1"), q2_next_step: get("q2"), q3_could_help: get("q3"),
      q4_most_useful: txt("t4"), q5_confusing: txt("t5"), q6_change: txt("t6"), q7_preferred_and_why: txt("t7"), submitted_at: new Date().toISOString()
    });

  document.addEventListener("click", function (e) {
